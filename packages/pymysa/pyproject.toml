[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymysa"
version = "0.1.0"
description = "Python SDK for Mysa smart thermostats"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "axelrtgs" }]
dependencies = [
    "aiohttp>=3.9",
    "pycognito>=2024.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
pymysa-debug = "pymysa.debug.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pymysa"]

[tool.hatch.build.targets.wheel.force-include]
"src/pymysa/py.typed" = "pymysa/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

# Neither ships type information. pycognito is imported inside one function, for the
# SRP login only (spec 01).
[[tool.mypy.overrides]]
module = ["pycognito.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
