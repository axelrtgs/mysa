name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  pymysa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pymysa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy --strict src/pymysa
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component ruff mypy ./packages/pymysa
      - run: python3 scripts/versions.py
      - run: ruff check custom_components tests scripts
      - run: mypy --strict custom_components scripts
      - run: pytest tests -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
