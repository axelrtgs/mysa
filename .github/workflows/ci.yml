name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pymysa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pymysa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy --strict src/pymysa
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/homeassistant-mysa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component ruff mypy ../pymysa
      - run: ruff check custom_components tests
      - run: mypy --strict custom_components
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The published action mounts the repository root, where this repository has no
      # custom_components directory. The image is the same; the package is what is
      # mounted as its workspace.
      - run: >
          docker run --rm
          -v ${{ github.workspace }}/packages/homeassistant-mysa://github/workspace
          ghcr.io/home-assistant/hassfest
