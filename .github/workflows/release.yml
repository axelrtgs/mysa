name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # HACS offers the five latest releases in its version picker and installs the
      # repository at that tag, while Home Assistant reports the manifest's own version.
      # A tag that disagrees with the manifest gives the two different answers.
      - name: The manifest version must be the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/mysa/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "tag is $tag, manifest says $manifest" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
